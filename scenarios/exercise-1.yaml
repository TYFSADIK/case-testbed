# Exercise 1: a four-hour day on the Barrie waterfront.
# The instructor's master scenario events list (MSEL). Times are seconds of
# simulated time from 06:00. The first 30 minutes are normal on purpose: the
# twin learns what normal looks like before anything happens.
name: Exercise 1, Kempenfelt Bay
duration: 14400
wind_toward_deg: 15
events:
